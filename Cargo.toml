[package]
name = "emu-board"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonc-parser = "0.23"

directories = "6"
once_cell = "1.19"
anyhow = "1.0"
evdevil = "0.4.0"
toml = "0.8"
notify = "8"
signal-hook = "0.4"
notify-rust = "4"

[build-dependencies]
glib-build-tools = "0.21"
